[project]
name = "hypermodel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "transformers>=4.56",
    "numpy",
    "matplotlib",
    "datasets>=5.0.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypermodel"]

# Blackwell (sm_120) needs CUDA 12.8+ wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads a real model from the Hugging Face hub"]
